[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qorgan"
version = "0.1.0"
description = "Qorgan -- scam-call detection & explainability for Kazakhstan (GovTech Camp sprint)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "google-genai>=1.0",
    "torch>=2.2",
    "transformers>=4.44",
    "scikit-learn>=1.5",
    "captum>=0.7",
    "sentence-transformers>=3.0",
    "hdbscan>=0.8.36",
    "networkx>=3.3",
    "faster-whisper>=1.0",
    "streamlit>=1.49",  # width="stretch" dataframe API (replaces use_container_width)
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
