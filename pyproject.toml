[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qorgan"
version = "0.1.0"
description = "Qorgan -- scam-call detection & explainability for Kazakhstan (GovTech Camp sprint)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "google-genai>=1.0",
    "torch>=2.2",
    "transformers>=4.44",
    "scikit-learn>=1.5",
    "captum>=0.7",
    "sentence-transformers>=3.0",
    "hdbscan>=0.8.36",
    "networkx>=3.3",
    "faster-whisper>=1.0",
    "streamlit>=1.49",  # width="stretch" dataframe API (replaces use_container_width)
    "fastapi>=0.110",   # thin API + static host for the landing site (qorgan.api)
    "uvicorn>=0.30",
    "huggingface_hub>=0.23",  # deploy bootstrap pulls model + corpus from HF
    "onnxruntime>=1.17",      # the int8 embedder the server shares with the browser (ADR D17)
    "tokenizers>=0.15",
    "num2words>=0.5",         # ASR-style numerals→words (RU/KK) for the A10 realism eval + augmentation
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5"]
# Live microphone capture + streaming ASR for the Live-call tab (design spec §06).
# Optional so the judges' base install stays light; the app degrades gracefully without it.
live = ["vosk>=0.3.44", "streamlit-webrtc>=0.47", "sounddevice>=0.4.7"]
# Static-quantisation experiment (scripts/quantize_embedder.py; measured no-go, ADR D18).
quant = ["onnx>=1.15"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
