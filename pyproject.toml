[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qorgan"
version = "0.1.0"
description = "Qorgan -- on-device phone-scam decision support for Kazakh and Russian calls"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

# The runtime the shipped product needs: the FastAPI server (site host, /api/analyze on the
# int8 ONNX embedder + sklearn heads, reports, partner + analyst APIs, Level-2 number graph),
# the deploy bootstrap and head retraining. Everything heavier is an extra below.
dependencies = [
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "networkx>=3.3",          # phone-number co-occurrence graph (primary org link)
    "fastapi>=0.110",         # API + static host for site/ (qorgan.api)
    "uvicorn>=0.30",
    "huggingface_hub>=0.23",  # deploy bootstrap pulls model + corpus from HF
    "onnxruntime==1.21.*",    # PINNED to the onnxruntime-node that transformers.js 3.8.1 bundles: same version = bit-identical int8 embeddings (ADR D32); move both together
    "tokenizers>=0.15",
    "num2words>=0.5",         # ASR-style numerals→words (RU/KK) for the A10 realism eval + augmentation
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "httpx>=0.27"]  # httpx: FastAPI TestClient
# Gemini: the `llm` cloud second opinion (sends text abroad -- explicit request only, ADR D11)
# and build-time data generation / re-labelling.
cloud = ["google-genai>=1.0"]
# Streamlit dev harness (app/, ADR D4 -- never the product) and its server-side transcription.
harness = ["streamlit>=1.49", "faster-whisper>=1.0"]
# Live microphone capture for the harness's Live-call tab (design spec §06).
live = ["vosk>=0.3.44", "streamlit-webrtc>=0.47", "sounddevice>=0.4.7"]
# Experiments and abandoned paths kept reproducible: the xlmr fine-tune + Captum attribution,
# fp32 `sentence-transformers` embeddings, the optional HDBSCAN text overlay (off by default).
research = ["torch>=2.2", "transformers>=4.44", "captum>=0.7", "sentence-transformers>=3.0", "hdbscan>=0.8.36"]
# Static-quantisation experiment (scripts/quantize_embedder.py; measured no-go, ADR D18).
quant = ["onnx>=1.15"]
all = ["qorgan[dev,cloud,harness,live,research,quant]"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
