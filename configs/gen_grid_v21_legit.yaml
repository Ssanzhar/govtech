  nurse: ["18-25", "26-40", "41-60"]
  taxi driver: ["26-40", "41-60", "61+"]
  schoolteacher: ["26-40", "41-60", "61+"]
  civil servant: ["26-40", "41-60"]
  accountant: ["26-40", "41-60", "61+"]
