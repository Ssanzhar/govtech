  5: 0.15
  7: 0.25
  9: 0.25
  12: 0.20
  15: 0.15

outcomes:
  complies: 0.30
  refuses: 0.30
  hangs_up: 0.20
  calls_back: 0.20

channels:
  cold_call: 0.45
  call_after_sms: 0.25
  messenger_then_call: 0.15
  second_call: 0.15

# Which stages of the scheme the call shows (scams); negatives use `none`.
stages:
  hook_only: 0.15
  hook_escalation: 0.25
  full: 0.45
  extraction_handoff: 0.15

persona:
  age_band: {"18-25": 0.2, "26-40": 0.3, "41-60": 0.3, "61+": 0.2}
  region:
    - Almaty
    - Astana
    - Shymkent
    - Karaganda
    - Aktobe
    - Atyrau
    - Pavlodar
    - Kostanay
    - Oskemen
    - Turkestan region (village)
