# Generation grid v2.1 / A2 (PLAN_2026-10 track A): a SCAM-ONLY run, derived from
# configs/gen_grid.yaml. Run: `python -m qorgan.data.gen manifest --run v21_scam --size 236
# --grid configs/gen_grid_v21_scam.yaml`.
#
# Why (style confound, ADR D63 phase 2): after `v21_legit` (300 legit rows) the Claude block is
# pilot 72/120 + p2 636/1325 + v21_legit 0/300 = 708 scams / 1745 = 0.406, against the Gemini
# train block's 448/940 = 0.4766. x new scams restore the rate: (708 + x) / (1745 + x) = 448/940
# -> x = 236.3 -> 236 (944/1981 = 0.4765).
#
# Everything below except `seed`, `registers`, `scam_share` and `scam_scenarios` is the base
# grid's (scheme weights, indirect share, stages, tactics, lengths, outcomes, channels, persona).

version: 2
seed: 20261023

registers:          # D70/D71: no English; its 0.15 goes to Kazakh, the weakest language
  kk: 0.45
  ru: 0.30
  mixed: 0.25

scam_share: 1.0     # scam-only run
twin_share: 0.0     # no negatives

# Within the scam share: schemes listed here get `weight` x the base allocation (the
# low-arousal administrative pretexts the cross-generator recall loss points at, D63 §why).
scheme_weights:
  parcel_code: 1.4
  benefits_recalc_and_clinic: 1.4
  mirror_loan: 1.4
  egov_eds_renewal: 1.4
  cash_declaration_courier: 1.4
  erroneous_transfer: 1.4
  job_task_advance_fee: 1.4
  telecom_contract_expiry: 1.4
  two_stage_escalation: 1.4

# The reassurance line as a manipulation (v2.1): a scammer volunteers "we never ask for your
# code / tell no one" before the ask, so the line is not a legit-only signal (v21_legit keeps it
# in ~20 bank calls). 28 cells, 14 per group, never `hook_only` (the line comes before an ask).
# English briefs only: no ru/kk phrase reaches the writer.
scam_scenarios:
  - brief: "Early in the call, before any ask, the caller volunteers -- as a real bank or regulator would -- that the bank never asks customers for codes, passwords or card details over the phone and that the callee must never tell anyone such a code. The caller uses this to win trust; later the caller still makes the scheme's ask, framing it as an exception (it is 'not for me but for the system', the callee 'only confirms', 'enters it themselves while I stay on the line', or it is 'the protection procedure')."
    schemes: [bank_card_phish, bank_safe_account, mirror_loan, regulator_impersonation, cash_declaration_courier]
    cells: 14
    stages: [hook_escalation, full, extraction_handoff]
  - brief: "Early in the call, before any ask, the caller volunteers that they will never ask for a code or a password and warns the callee never to tell anyone one, sounding like a careful official or company. The caller uses this to win trust; later the caller still makes the scheme's ask, framing it as something different (an automatic confirmation, a registration or ticket number, 'just read me what the message says', or a step the callee does themselves while the caller waits)."
    schemes: [parcel_code, egov_eds_renewal, telecom_contract_expiry, benefits_recalc_and_clinic, utility_code, two_stage_escalation]
    cells: 14
    stages: [hook_escalation, full, extraction_handoff]

# Unused in a scam-only run, kept for schema completeness (copied from the base grid).
# Within the negative share. The six v2 guardrail classes are the priority; the v1 classes keep
# the old guardrails alive in the new generator's style.
negative_weights:
  legit_delivery_code: 1.5
  legit_refund_request: 1.5
  legit_employer_request: 1.5
  legit_clinic_appointment: 1.5
  legit_telecom_offer: 1.5
  legit_utility_notice: 1.5
  legit_bank_call: 1.5
  legit_gov_service: 1.2
  family_money_request: 1.2
  delivery_notification: 0.6
  general_conversation: 0.8

# The role a legitimate caller of each negative class actually is (null = a private person).
negative_roles:
  legit_delivery_code: [courier_post]
  legit_refund_request: [null]
  legit_employer_request: [employer]
  legit_clinic_appointment: [clinic]
  legit_telecom_offer: [telecom_operator]
  legit_utility_notice: [utility]
  legit_bank_call: [bank_security]
  legit_gov_service: [egov_con, tax_kgd, pension_social, police]  # police: a district officer inviting a witness, no asks
  family_money_request: [relative_friend]
  delivery_notification: [courier_post]
  general_conversation: [null]

negative_roles:
  legit_delivery_code: [courier_post]
  legit_refund_request: [null]
  legit_employer_request: [employer]
  legit_clinic_appointment: [clinic]
  legit_telecom_offer: [telecom_operator]
  legit_utility_notice: [utility]
  legit_bank_call: [bank_security]
  legit_gov_service: [egov_con, tax_kgd, pension_social, police]
  family_money_request: [relative_friend]
  delivery_notification: [courier_post]
  general_conversation: [null]

confusable_negative_share: 0.6

# Share of scams whose key request is phrased INDIRECTLY (no stock wording; the ask is implied,
# euphemised or spread over turns). Drives the lexicon-leak gate (>= 30 % cue-free positives).
indirect_scam_share: 0.5

# Stages a scam cell may show depend on its tactics: `hook_only` is allowed only when every
# tactic of the cell is one a hook can show (no extraction ask). Optional tactics of a hook_only
# cell are drawn from this set too.
hook_compatible_tactics:
  - imp_bank
  - imp_law_enforcement
  - imp_gov_service
  - imp_regulator
  - imp_telecom_delivery_utility
  - imp_personal
  - urgency
  - fear_threat
  - secrecy
  - prize_lottery
  - investment_scam
  - mule_recruitment
  - callback_instruction

# Optional tactics drawn per scam cell, on top of the scheme's `core` (uniform in range).
optional_tactics: {min: 0, max: 2}

length_targets:     # utterances; weights
  5: 0.15
  7: 0.25
  9: 0.25
  12: 0.20
  15: 0.15

outcomes:
  complies: 0.30
  refuses: 0.30
  hangs_up: 0.20
  calls_back: 0.20

channels:
  cold_call: 0.45
  call_after_sms: 0.25
  messenger_then_call: 0.15
  second_call: 0.15

# Which stages of the scheme the call shows (scams); negatives use `none`.
stages:
  hook_only: 0.15
  hook_escalation: 0.25
  full: 0.45
  extraction_handoff: 0.15

persona:
  age_band: {"18-25": 0.2, "26-40": 0.3, "41-60": 0.3, "61+": 0.2}
  region:
    - Almaty
    - Astana
    - Shymkent
    - Karaganda
    - Aktobe
    - Atyrau
    - Pavlodar
    - Kostanay
    - Oskemen
    - Turkestan region (village)
    - Kyzylorda
    - Taraz
  occupation:
    - student
    - schoolteacher
    - pensioner
    - sole trader (ИП)
    - office worker
    - nurse
    - taxi driver
    - accountant
    - stay-at-home parent
    - IT specialist
    - bazaar vendor
    - oil-field shift worker
    - civil servant
    - small-business owner

# Which occupations fit which age band (phase 2; the pilot drew them independently and wrote a
# "pensioner 18-25"). An occupation missing here fits every band.
occupation_age_bands:
  student: ["18-25", "26-40"]
  pensioner: ["61+"]
  stay-at-home parent: ["18-25", "26-40", "41-60"]
  IT specialist: ["18-25", "26-40", "41-60"]
  oil-field shift worker: ["18-25", "26-40", "41-60"]
  nurse: ["18-25", "26-40", "41-60"]
  taxi driver: ["26-40", "41-60", "61+"]
  schoolteacher: ["26-40", "41-60", "61+"]
  civil servant: ["26-40", "41-60"]
  accountant: ["26-40", "41-60", "61+"]
  small-business owner: ["26-40", "41-60", "61+"]
  sole trader (ИП): ["26-40", "41-60", "61+"]
