# Layer 2 of taxonomy v2 (ADR D63): who the caller CLAIMS to be.
#
# DISPLAY-ONLY. This file never feeds the classifier: it is not a model feature, not hashed
# into the trained bundle (`weights.json::lexicon` holds only the cue and reassurance hashes),
# and editing it does not trigger the "lexicon edit forces a retrain" rule. It drives exactly
# two things: the role line of the explanation («Звонящий представился …», a verbatim span
# from the transcript plus a reviewed template) and the `role` input of the Layer-3 scheme
# rules (`data/taxonomy/schemes.yaml`). The one-time v1 -> v2 label migration
# (`qorgan.data.migrate_v2`) also reads it; its output is frozen into the corpus and reviewed.
#
# Matching: `cue_match.find_cue` (the same matcher, Python and JS, as the hard-signal cues --
# verbatim case-insensitive first, bounded-edit only for long cues). For each role the first
# cue that matches gives a span; a span overlapped by a LONGER span of another role is
# dropped; the earliest remaining span wins (ties: file order). Cues are CLAIM-shaped
# ("звоню из банка", "служба безопасности банка"), never a bare topic word that a victim or a
# legitimate caller would say about someone else.
#
# Sources: docs/research/2026-10/model_taxonomy.md Part B (B1 scenarios, B2 roles) and
# general knowledge of KZ institutions. NEVER extended from a held-out split (ADR D35/D43).
#
# names: ru is INSTRUMENTAL (fills «Звонящий представился {role}»), kk is NOMINATIVE (fills
# «Қоңырау шалушы өзін {role} деп таныстырды»), en takes an article ("claimed to be {role}").
# `imp_tactic` is the v2 impersonation tactic the role belongs to (null: no impersonation
# tactic -- an online buyer or a broker is a pretext, not an impersonated body).

version: 1

# Self-introduction by organisation (ADR D63 phase 2; matcher in `qorgan.explain.roles`).
# A role's `orgs` are organisation names; one becomes a claim only when an introduction marker
# below sits within `ROLE_INTRO_WINDOW` (config.py) tokens of it in the same sentence of the
# same line (D63 v2.1: a bare Kazakh ablative «Kaspi-ден» is no longer enough; precision over
# recall). `channel` vetoes an organisation used as a payment channel or a help desk.
# Tokens: a trailing `*` makes
# that word a prefix; otherwise it matches exactly or with one affix glued on. Personal names
# are never matched. Sources: the 59 role misses of the phase-1 pilot (future TRAIN data, never
# a held-out split) and general knowledge of KZ brands; measured again on the phase-2 batch,
# which this list was NOT widened from.
intro:
  markers:
    # ru
    - это
    - меня зовут
    - беспоко*
    - звоню
    - звоним
    - звонит
    - звонят
    - говорит
    - на связи
    - компани*
    - служб*
    - отдел*
    - филиал*
    - департамент*
    - менеджер*
    - оператор*
    - специалист*
    - сотрудни*
    - представител*
    - курьер*
    - мониторинг*
    # kk
    - хабарлас*
    - қоңырау
    - бөлім*
    - қызмет*
    - маман*
    - орталығ*
    - атым
    - есімім
    - банктен
    - банкінен
    - банктің
    # en
    - this is
    - it s
    - it is
    - my name is
    - calling
    - team
    - department
    - customer care
    - customer service
    - courier
    - delivery
    - speaking
    - on behalf of
  affixes: [дан, ден, тан, тен, нан, нен]
  # D63 v2.1 (display-only fix): an organisation is NOT the caller's role when it is named as a
  # channel or a help desk. Sources: the 14 wrong role lines on role-less rows of the phase-2
  # batch (train data; D63 "Role line, extra fires"). `before`: the token right before the
  # organisation; `after`: the token right after it; `affixes`: a separate non-ablative case
  # ending right after it («Kaspi-ге», «Kaspi-дің»); `blockers`: a negation between the marker
  # and the organisation. A sentence end (. ! ?) between them is a wall too.
  channel:
    before: [на, через, по, в, во, via, through, on, to, into, in, by, with, using]
    after: [support, поддержк*, қолдау*, арқылы, app, application, приложени*, қосымша*]
    affixes: [ге, ке, ға, қа, да, де, та, те, дың, дің, тың, тің, ның, нің, ды, ді, ты, ті, ны, ні]
    blockers: [не, not, ни, no]

