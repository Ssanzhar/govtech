# Russian recommendation strings (design spec §10). Externalized from recommend.py so
# localization can be reviewed/edited without touching code; pending native-speaker review
# like templates_ru.yaml. Every taxonomy tactic id MUST have an entry (coverage is
# validated at load time — a detected tactic must never lack advice).

tactic_advice:
  impersonation_bank: >-
    Положите трубку и перезвоните в банк по номеру с обратной стороны карты —
    не по номеру, с которого вам звонят.
  impersonation_gov_police: >-
    Спросите ФИО, должность и номер дела, затем перезвоните в ведомство по официальному
    номеру. Полиция не решает вопросы деньгами по телефону.
  impersonation_telecom_delivery: >-
    Не продлевайте договоры и не подтверждайте данные по входящему звонку. Позвоните
    оператору или в службу доставки по официальному номеру.
  urgency: >-
    Не спешите. Давление «действовать прямо сейчас» — это и есть тактика мошенников.
    Завершите звонок и проверьте информацию самостоятельно.
  fear_threat: >-
    Не принимайте решений под давлением страха. Банк и полиция не угрожают по телефону.
    Проверьте информацию по официальным каналам.
  secrecy: >-
    «Никому не говорите» — явный признак мошенничества. Обсудите звонок с близкими
    или с сотрудником банка до любых действий.
  otp_request: >-
    Никогда и никому не называйте код из SMS или push-уведомления. Настоящие организации
    его не спрашивают.
  credentials_request: >-
    Не называйте номер карты, CVV, ИИН, логины и пароли. Сотрудникам банка эти данные
    не нужны.
  safe_account: >-
    Не переводите деньги. «Безопасных» и «резервных» счетов не существует — это главный
    сценарий кражи.
  payment_redirect: >-
    Не платите через QR-коды, терминалы, криптовалюту или переводы на личные номера
    по указанию звонящего.
  remote_access: >-
    Не устанавливайте AnyDesk, TeamViewer и другие программы удалённого доступа —
    это передаёт звонящему управление вашим устройством и счетами.
  prize_lottery: >-
    Настоящий выигрыш или выплата не требует предоплаты и подтверждения данных
    по телефону. Проверьте информацию на официальном сайте.
  investment_scam: >-
    «Гарантированный доход» — признак финансовой пирамиды. Проверьте лицензию компании
    на сайте регулятора (АРРФР) прежде чем вкладывать.
  mule_recruitment: >-
    Не оформляйте на себя карты и не принимайте чужие переводы за вознаграждение —
    это соучастие в отмывании денег и уголовная ответственность.
  verification_ploy: >-
    Не «подтверждайте» личность или операции по входящему звонку. Положите трубку
    и позвоните в организацию по официальному номеру.
  # ---- taxonomy v2 (ADR D63) ----
  imp_bank: >-
    Положите трубку и перезвоните в банк по номеру с обратной стороны карты или из
    приложения — не по номеру, с которого вам звонят.
  imp_law_enforcement: >-
    Полиция, КНБ и прокуратура не решают дела по телефону, не просят денег, кодов и
    «содействия следствию». Спросите ФИО и номер дела и позвоните в 102 сами.
  imp_gov_service: >-
    eGov, ЦОН, налоговая, пенсионный фонд и поликлиника не просят по телефону коды и
    пароли. Проверьте всё сами на egov.kz или по номеру 1414.
  imp_regulator: >-
    Нацбанк и АРРФР не звонят гражданам и не «защищают» деньги по телефону. Положите
    трубку и позвоните в свой банк по официальному номеру.
  imp_telecom_delivery_utility: >-
    Оператор, почта, курьер и коммунальные службы не просят коды из SMS. Проверьте
    договор, посылку или счёт в официальном приложении.
  imp_personal: >-
    Положите трубку и перезвоните родственнику или руководителю на их известный номер.
    Голос можно подделать; договоритесь в семье о кодовом слове.
  loan_inducement: >-
    Никогда не оформляйте кредит по указанию звонящего — «зеркальных» и «защитных»
    кредитов не бывает. Установите запрет на кредиты («Стоп-кредит») в eGov.
  cash_courier_handoff: >-
    Не снимайте и не передавайте наличные курьеру или «представителю банка». Ни одна
    организация не забирает деньги на «декларирование» или «хранение».
  refund_request: >-
    Ошибочный перевод возвращают только через банк — функцией «Вернуть перевод
    отправителю», на тот же счёт. Не переводите на другую карту или номер.
  task_advance_fee: >-
    Работа, за которую нужно сначала заплатить, — обман. Не вносите «депозиты» и
    «взносы» за задания, лайки или выкуп товара.
  callback_instruction: >-
    Не нажимайте кнопки и не перезванивайте на продиктованный номер. Найдите
    официальный номер организации сами — на сайте или на карте.
  # v3 (ADR D73) -- DRAFT pending the project owner's review
  minor_targeting: >-
    Взрослый незнакомец, который просит ребёнка молчать, принести карту родителей,
    продиктовать код или уйти из дома, — мошенник. Ребёнку: положи трубку и сразу расскажи
    родителям.
  blackmail_extortion: >-
    Не платите шантажистам: оплата не удаляет материалы, а только повышает требования.
    Сохраните переписку и номер, обратитесь в полицию по 102.
  survey_pretext: >-
    Настоящие опросы и перепись не спрашивают ИИН, номер карты, банк или коды из СМС. Прервите
    «опрос» и ничего не называйте.
  romance_trust: >-
    Если новый знакомый, которого вы не видели вживую, просит деньги на билет, таможню или
    лечение, — это типичная схема. Не переводите деньги.
  charity_appeal: >-
    Настоящие фонды собирают деньги на официальный счёт и не торопят. Не переводите на личную
    карту; проверьте фонд на его официальном сайте.

verification_questions:
  - "Назовите номер дела или заявки и вашу должность."
  - "Назовите ваш служебный идентификатор сотрудника."
  - "Я перезвоню вам по официальному номеру с сайта организации."
  - "Отправьте запрос через официальное приложение или личный кабинет."

low_confidence_note: >-
  Признаки неоднозначны. Мы не утверждаем, что это мошенничество — проверьте информацию
  самостоятельно по официальным каналам.

# Layer 3 (ADR D63): one reviewed line per scheme of data/taxonomy/schemes.yaml. Shown with
# the tactic advice once a scheme is derived; coverage is validated by explain/schemes.py.
scheme_advice:
  mirror_loan: >-
    Это схема «зеркального кредита»: настоящий банк не просит брать кредит, чтобы «отменить»
    чужую заявку. Ничего не оформляйте и позвоните в банк по номеру из приложения.
  cash_declaration_courier: >-
    Наличные не «декларируют» и не «страхуют» через курьера. Никому не передавайте деньги
    и сообщите о звонке в 102.
  two_stage_escalation: >-
    Сначала «курьер» или «ЦОН» просит код, затем звонит «полиция» или «Нацбанк» — это одна
    и та же схема. Положите трубку, позвоните в свой банк и смените пароли.
  erroneous_transfer: >-
    Если деньги правда пришли по ошибке, верните их только через банк, на тот же счёт.
    Просьба перевести «на другую карту» — признак мошенничества.
  job_task_advance_fee: >-
    Подработка «за лайки», где для вывода денег нужно внести взнос, — мошенничество.
    Не платите и не передавайте данные карты.
  egov_eds_renewal: >-
    ЭЦП продлевают только сами — на egov.kz или pki.gov.kz, никто не звонит с напоминанием
    и не просит код. Положите трубку.
  tax_kgd_business: >-
    Налоговая не приостанавливает деятельность по телефону и не просит ставить приложения.
    Проверьте уведомления в кабинете налогоплательщика (cabinet.kgd.gov.kz).
  benefits_recalc_and_clinic: >-
    Для перерасчёта выплат или записи в поликлинику код из SMS не нужен. Код — это
    ключ к вашему eGov и счетам: никому его не называйте.
  parcel_code: >-
    Код для получения посылки вводят только сами в приложении или показывают курьеру
    на месте — его не диктуют по телефону. Проверьте посылку в официальном приложении.
  telecom_contract_expiry: >-
    Договор со связью не «истекает» по звонку. Проверьте тариф в приложении оператора
    или в салоне связи; ничего не устанавливайте и не называйте кодов.
  utility_code: >-
    Коммунальные службы не просят коды из SMS для счётчиков или домофона. Уточните
    информацию в своём КСК/ОСИ или по номеру на квитанции.
  marketplace_seller_phish: >-
    Чтобы получить оплату, данные карты, CVV и коды не нужны. Не переходите по ссылкам
    «оплаты через площадку» и общайтесь только внутри сервиса.
  fake_boss: >-
    «Руководитель», который срочно и тайно просит денег или передаёт вас «куратору»,
    почти наверняка подделка. Перезвоните ему на известный номер или подойдите лично.
  relative_in_trouble: >-
    Звонок «родственника в беде» с нового номера — частая схема, голос могут подделать.
    Перезвоните родственнику на его обычный номер и задайте вопрос, ответ на который знает только он.
  regulator_impersonation: >-
    Нацбанк, АРРФР и Антифрод-центр не звонят гражданам и не переводят деньги «под защиту».
    Положите трубку и позвоните в свой банк.
  law_enforcement_threat: >-
    Настоящие следователи вызывают повесткой, а не требуют по телефону тайны, данных или
    денег. Положите трубку и позвоните в 102.
  bank_safe_account: >-
    «Безопасных счетов» не существует. Ничего не переводите; позвоните в банк по номеру
    с карты и, если нужно, заблокируйте карту в приложении.
  bank_card_phish: >-
    Банк никогда не спрашивает код из SMS, CVV или пароль и не просит ставить программы.
    Положите трубку и позвоните в банк сами.
  investment_broker: >-
    Гарантированного дохода не бывает. Проверьте лицензию компании на сайте АРРФР и не
    давайте удалённый доступ к телефону.
  prize_compensation: >-
    За настоящий выигрыш или компенсацию не платят «комиссию» и не называют данные карты.
    Проверьте информацию на официальном сайте организации.
  mule_recruitment: >-
    Приём и пересылка чужих денег за процент — это «дропперство», за него наступает
    уголовная ответственность. Откажитесь.
  # v3 (ADR D73) -- DRAFT pending the project owner's review
  minor_targeted: >-
    Звонок ребёнку с просьбой о секрете, карте родителей или кодах — схема против детей.
    Поговорите с ребёнком: никаких кодов и секретов от родителей, при сомнении — положить
    трубку.
  blackmail: >-
    Это шантаж. Не платите и не продолжайте разговор; сохраните доказательства и заявите в
    полицию по 102.
  survey_data_harvest: >-
    «Опрос», который переходит к ИИН, банку или кодам, — сбор данных для мошенничества.
    Положите трубку.
  romance_scam: >-
    Романтическое знакомство, которое заканчивается просьбой о деньгах, — схема «брачных
    аферистов». Не переводите деньги человеку, которого не видели вживую.
  charity_fraud: >-
    Сбор «на лечение» или «пострадавшим» на личную карту — частая схема. Помогайте только
    через официальный сайт фонда.
