# English explanation templates (ADR D52). Externalized from explainer.py so localization can
# be reviewed/edited without touching code. Loaded by explain/templates.py.
# Placeholders: {tags}, {spans} in reason_template; {backend} in uncalibrated_suffix.

reason_template: "Signs of a scam were detected: {tags}. Trigger phrases from the call: {spans}."
no_signal_reason: "No clear signs of a scam were detected."
spans_placeholder: "—"
# Layer 2 role slot (ADR D63): {role} = the role name from data/lexicon/roles.yaml, {span} = the
# caller's own words. Rendered only when the role lexicon found a claim.
role_template: "The caller claimed to be {role}: «{span}»."
caveat: >-
  The model can be wrong, especially on unusual, very short or interrupted calls.
  Weigh this alongside everything else you know.
uncalibrated_suffix: " The confidence score ({backend}) is not calibrated — this is a baseline LLM."
human_note: "This is a decision-support tool. A person always makes the final decision."
confidence:
  high: "Model confidence: high."
  medium: "Model confidence: medium."
  low: "Model confidence: low."
  unknown: "Model confidence was not reported."
