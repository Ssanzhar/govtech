# Kazakh recommendation strings (design spec §10). Externalized from recommend.py so
# localization can be reviewed/edited without touching code; pending native-speaker review
# like templates_kk.yaml. Every taxonomy tactic id MUST have an entry (coverage is
# validated at load time — a detected tactic must never lack advice).

tactic_advice:
  impersonation_bank: >-
    Трубканы қойып, картаңыздың артындағы нөмір арқылы банкке өзіңіз қоңырау шалыңыз —
    сізге қоңырау шалған нөмірге емес.
  impersonation_gov_police: >-
    Аты-жөнін, лауазымын және іс нөмірін сұраңыз, содан кейін мекемеге ресми нөмір
    арқылы қайта қоңырау шалыңыз. Полиция мәселені телефон арқылы ақшамен шешпейді.
  impersonation_telecom_delivery: >-
    Кіріс қоңырау арқылы шарт ұзартпаңыз және дерек растамаңыз. Операторға немесе
    жеткізу қызметіне ресми нөмір арқылы хабарласыңыз.
  urgency: >-
    Асықпаңыз. «Дәл қазір әрекет ету керек» деген қысым — алаяқтардың өз тәсілі.
    Қоңырауды аяқтап, ақпаратты өзіңіз тексеріңіз.
  fear_threat: >-
    Қорқыныш ықпалымен шешім қабылдамаңыз. Банк пен полиция телефон арқылы қорқытпайды.
    Ақпаратты ресми арналар арқылы тексеріңіз.
  secrecy: >-
    «Ешкімге айтпаңыз» — алаяқтықтың айқын белгісі. Кез келген әрекеттен бұрын қоңырау
    туралы жақындарыңызбен немесе банк қызметкерімен сөйлесіңіз.
  otp_request: >-
    SMS немесе push-хабарламадағы кодты ешқашан ешкімге айтпаңыз. Нағыз ұйымдар оны
    сұрамайды.
  credentials_request: >-
    Карта нөмірін, CVV, ЖСН, логин мен құпиясөздерді айтпаңыз. Банк қызметкерлеріне
    бұл деректер қажет емес.
  safe_account: >-
    Ақша аудармаңыз. «Қауіпсіз» немесе «резервтік» шоттар жоқ — бұл ұрлықтың басты
    сценарийі.
  payment_redirect: >-
    Қоңырау шалушының нұсқауымен QR-код, терминал, криптовалюта немесе жеке нөмірге
    аударым арқылы төлем жасамаңыз.
  remote_access: >-
    AnyDesk, TeamViewer және басқа қашықтан қосылу бағдарламаларын орнатпаңыз —
    бұл құрылғыңыз бен шоттарыңызды басқаруды қоңырау шалушыға береді.
  prize_lottery: >-
    Нағыз ұтыс немесе төлем алдын ала төлемді және телефон арқылы дерек растауды талап
    етпейді. Ақпаратты ресми сайттан тексеріңіз.
  investment_scam: >-
    «Кепілді табыс» — қаржы пирамидасының белгісі. Салым жасамас бұрын компанияның
    лицензиясын реттеуші (АРРФР) сайтынан тексеріңіз.
  mule_recruitment: >-
    Сыйақыға өз атыңызға карта ашпаңыз және бөтен аударымдарды қабылдамаңыз — бұл ақша
    жылыстатуға қатысу және қылмыстық жауапкершілік.
  verification_ploy: >-
    Кіріс қоңырау арқылы жеке басты немесе операцияны «растамаңыз». Трубканы қойып,
    ұйымға ресми нөмір арқылы қоңырау шалыңыз.
  # ---- taxonomy v2 (ADR D63) ----
  imp_bank: >-
    Трубканы қойып, банкке картаның артындағы немесе қосымшадағы нөмір арқылы өзіңіз
    қоңырау шалыңыз — сізге хабарласқан нөмірге емес.
  imp_law_enforcement: >-
    Полиция, ҰҚК және прокуратура істі телефонмен шешпейді, ақша, код немесе «тергеуге
    көмек» сұрамайды. Аты-жөнін және іс нөмірін сұрап, 102-ге өзіңіз қоңырау шалыңыз.
  imp_gov_service: >-
    eGov, ХҚКО, салық қызметі, зейнетақы қоры мен емхана телефон арқылы код пен
    құпиясөз сұрамайды. Бәрін egov.kz сайтынан немесе 1414 нөмірі арқылы өзіңіз тексеріңіз.
  imp_regulator: >-
    Ұлттық банк пен ҚНРДА азаматтарға қоңырау шалмайды және ақшаны телефон арқылы
    «қорғамайды». Трубканы қойып, өз банкіңізге ресми нөмір арқылы хабарласыңыз.
  imp_telecom_delivery_utility: >-
    Байланыс операторы, пошта, курьер және коммуналдық қызметтер SMS-кодты сұрамайды.
    Шартты, сәлемдемені немесе шотты ресми қосымшадан тексеріңіз.
  imp_personal: >-
    Трубканы қойып, туысыңызға немесе басшыңызға олардың белгілі нөмірі арқылы қайта
    хабарласыңыз. Дауысты жасанды түрде көшіруге болады; отбасында кодтық сөз келісіп қойыңыз.
  loan_inducement: >-
    Қоңырау шалушының нұсқауымен ешқашан несие рәсімдемеңіз — «айналы» немесе
    «қорғаныш» несие болмайды. eGov арқылы несиеге тыйым («Стоп-кредит») қойыңыз.
  cash_courier_handoff: >-
    Қолма-қол ақшаны шешпеңіз және курьерге немесе «банк өкіліне» бермеңіз. Ешбір ұйым
    ақшаны «декларациялау» немесе «сақтау» үшін алып кетпейді.
  refund_request: >-
    Қате аударым тек банк арқылы — «Аударымды жіберушіге қайтару» функциясымен, сол шотқа
    қайтарылады. Басқа картаға немесе нөмірге аудармаңыз.
  task_advance_fee: >-
    Алдымен ақша төлеуді талап ететін жұмыс — алдау. Тапсырма, лайк немесе тауар сатып
    алу үшін «депозит» пен «жарна» салмаңыз.
  callback_instruction: >-
    Батырмаларды баспаңыз және айтылған нөмірге қайта хабарласпаңыз. Ұйымның ресми
    нөмірін сайттан немесе картадан өзіңіз табыңыз.
  # v3 (ADR D73) -- DRAFT pending the project owner's review
  minor_targeting: >-
    Балаға құпия сақтауды, ата-анасының картасын әкелуді, кодты айтуды немесе үйден кетуді
    сұраған бейтаныс ересек — алаяқ. Балаға: телефонды қойып, бірден ата-анаңа айт.
  blackmail_extortion: >-
    Бопсалаушыларға төлемеңіз: төлем материалдарды өшірмейді, тек талапты көбейтеді. Хат-хабар
    мен нөмірді сақтап, 102 арқылы полицияға жүгініңіз.
  survey_pretext: >-
    Нағыз сауалнама мен санақ ЖСН, карта нөмірін, банкті немесе СМС кодын сұрамайды.
    «Сауалнаманы» тоқтатып, ештеңе айтпаңыз.
  romance_trust: >-
    Өзіңіз көрмеген жаңа таныс билетке, кеденге немесе емделуге ақша сұраса, бұл — әдеттегі
    схема. Ақша аудармаңыз.
  charity_appeal: >-
    Нағыз қорлар ақшаны ресми шотқа жинайды және асықтырмайды. Жеке картаға аудармаңыз; қорды
    оның ресми сайтынан тексеріңіз.

verification_questions:
  - "Іс немесе өтінім нөмірі мен лауазымыңызды атаңыз."
  - "Қызметтік қызметкер идентификаторыңызды атаңыз."
  - "Ұйым сайтындағы ресми нөмір арқылы өзім қайта қоңырау шаламын."
  - "Сұранысты ресми қосымша немесе жеке кабинет арқылы жіберіңіз."

low_confidence_note: >-
  Белгілер бір мағыналы емес. Бұл алаяқтық деп кесіп айтпаймыз — ақпаратты ресми арналар
  арқылы өзіңіз тексеріңіз.

# Layer 3 (ADR D63): one reviewed line per scheme of data/taxonomy/schemes.yaml (pending
# native-speaker review like the rest of this file). Coverage is validated by explain/schemes.py.
scheme_advice:
  mirror_loan: >-
    Бұл «айналы несие» схемасы: нағыз банк бөтен өтінімді «жабу» үшін несие алуды
    сұрамайды. Ештеңе рәсімдемей, банкке қосымшадағы нөмір арқылы хабарласыңыз.
  cash_declaration_courier: >-
    Қолма-қол ақша курьер арқылы «декларацияланбайды» және «сақтандырылмайды». Ешкімге
    ақша бермеңіз, қоңырау туралы 102-ге хабарлаңыз.
  two_stage_escalation: >-
    Алдымен «курьер» немесе «ХҚКО» код сұрайды, кейін «полиция» не «Ұлттық банк»
    хабарласады — бұл бір схема. Трубканы қойып, банкке қоңырау шалып, құпиясөздерді ауыстырыңыз.
  erroneous_transfer: >-
    Ақша шынымен қате келсе, оны тек банк арқылы, сол шотқа қайтарыңыз. «Басқа картаға»
    аударуды сұрау — алаяқтық белгісі.
  job_task_advance_fee: >-
    Табысты шығару үшін жарна салу керек «лайк үшін» жұмыс — алаяқтық. Төлемеңіз және
    карта деректерін бермеңіз.
  egov_eds_renewal: >-
    ЭЦҚ-ны тек өзіңіз — egov.kz немесе pki.gov.kz сайтында ұзартасыз; ешкім еске салып
    қоңырау шалмайды және код сұрамайды. Трубканы қойыңыз.
  tax_kgd_business: >-
    Салық қызметі қызметті телефон арқылы тоқтатпайды және қосымша орнатуды сұрамайды.
    Хабарламаларды салық төлеушінің кабинетінен (cabinet.kgd.gov.kz) тексеріңіз.
  benefits_recalc_and_clinic: >-
    Төлемді қайта есептеу немесе емханаға жазылу үшін SMS-код қажет емес. Код — eGov
    пен шоттарыңыздың кілті: оны ешкімге айтпаңыз.
  parcel_code: >-
    Сәлемдемені алу кодын тек қосымшада өзіңіз енгізесіз немесе курьерге орнында
    көрсетесіз — телефонмен айтпайсыз. Сәлемдемені ресми қосымшадан тексеріңіз.
  telecom_contract_expiry: >-
    Байланыс шарты қоңырау арқылы «аяқталмайды». Тарифті оператордың қосымшасынан немесе
    байланыс салонынан тексеріңіз; ештеңе орнатпаңыз, код айтпаңыз.
  utility_code: >-
    Коммуналдық қызметтер есептегіш немесе домофон үшін SMS-код сұрамайды. Ақпаратты
    ПИБ/КСК-дан немесе түбіртектегі нөмір арқылы нақтылаңыз.
  marketplace_seller_phish: >-
    Төлем алу үшін карта деректері, CVV және код қажет емес. «Алаң арқылы төлем»
    сілтемелерін ашпаңыз, тек сервис ішінде сөйлесіңіз.
  fake_boss: >-
    Ақшаны шұғыл әрі жасырын сұрайтын немесе сізді «кураторға» қосатын «басшы» —
    жалған болуы ықтимал. Оның белгілі нөміріне қайта хабарласыңыз немесе жеке барыңыз.
  relative_in_trouble: >-
    Жаңа нөмірден «қиын жағдайға түскен туыс» қоңырауы — жиі схема, дауысты жасауға болады.
    Туысыңыздың әдеттегі нөміріне хабарласып, тек ол білетін сұрақ қойыңыз.
  regulator_impersonation: >-
    Ұлттық банк, ҚНРДА және Антифрод орталығы азаматтарға қоңырау шалмайды және ақшаны
    «қорғауға» аудармайды. Трубканы қойып, өз банкіңізге хабарласыңыз.
  law_enforcement_threat: >-
    Нағыз тергеуші шақыру қағазымен шақырады, телефонмен құпия, дерек немесе ақша талап
    етпейді. Трубканы қойып, 102-ге қоңырау шалыңыз.
  bank_safe_account: >-
    «Қауіпсіз шот» деген болмайды. Ештеңе аудармаңыз; картадағы нөмір арқылы банкке
    хабарласып, қажет болса картаны қосымшада бұғаттаңыз.
  bank_card_phish: >-
    Банк ешқашан SMS-кодты, CVV-ді немесе құпиясөзді сұрамайды және бағдарлама орнатуды
    талап етпейді. Трубканы қойып, банкке өзіңіз хабарласыңыз.
  investment_broker: >-
    Кепілді табыс болмайды. Компанияның лицензиясын ҚНРДА сайтынан тексеріңіз және
    телефоныңызға қашықтан қол жеткізу бермеңіз.
  prize_compensation: >-
    Нағыз ұтыс немесе өтемақы үшін «комиссия» төленбейді және карта деректері айтылмайды.
    Ақпаратты ұйымның ресми сайтынан тексеріңіз.
  mule_recruitment: >-
    Пайызға бөтен ақшаны қабылдап, әрі қарай аудару — «дропперлік», бұл үшін қылмыстық
    жауапкершілік бар. Бас тартыңыз.
  # v3 (ADR D73) -- DRAFT pending the project owner's review
  minor_targeted: >-
    Балаға құпия, ата-анасының картасы немесе код туралы хабарласу — балаларға қарсы схема.
    Баламен сөйлесіңіз: ата-анадан құпия да, код та жоқ, күмән болса — телефонды қою керек.
  blackmail: >-
    Бұл — бопсалау. Төлемеңіз және әңгімені жалғастырмаңыз; дәлелдерді сақтап, 102 арқылы
    полицияға арыз беріңіз.
  survey_data_harvest: >-
    ЖСН-ге, банкке немесе кодтарға ауысатын «сауалнама» — алаяқтық үшін деректер жинау.
    Телефонды қойыңыз.
  romance_scam: >-
    Ақша сұраумен аяқталатын романтикалық таныстық — «неке алаяқтарының» схемасы. Өзіңіз
    көрмеген адамға ақша аудармаңыз.
  charity_fraud: >-
    Жеке картаға «емделуге» немесе «зардап шеккендерге» ақша жинау — жиі кездесетін схема. Тек
    қордың ресми сайты арқылы көмектесіңіз.
