# Kazakh recommendation strings (design spec §10). Externalized from recommend.py so
# localization can be reviewed/edited without touching code; pending native-speaker review
# like templates_kk.yaml. Every taxonomy tactic id MUST have an entry (coverage is
# validated at load time — a detected tactic must never lack advice).

tactic_advice:
  impersonation_bank: >-
    Трубканы қойып, картаңыздың артындағы нөмір арқылы банкке өзіңіз қоңырау шалыңыз —
    сізге қоңырау шалған нөмірге емес.
  impersonation_gov_police: >-
    Аты-жөнін, лауазымын және іс нөмірін сұраңыз, содан кейін мекемеге ресми нөмір
    арқылы қайта қоңырау шалыңыз. Полиция мәселені телефон арқылы ақшамен шешпейді.
  impersonation_telecom_delivery: >-
    Кіріс қоңырау арқылы шарт ұзартпаңыз және дерек растамаңыз. Операторға немесе
    жеткізу қызметіне ресми нөмір арқылы хабарласыңыз.
  urgency: >-
    Асықпаңыз. «Дәл қазір әрекет ету керек» деген қысым — алаяқтардың өз тәсілі.
    Қоңырауды аяқтап, ақпаратты өзіңіз тексеріңіз.
  fear_threat: >-
    Қорқыныш ықпалымен шешім қабылдамаңыз. Банк пен полиция телефон арқылы қорқытпайды.
    Ақпаратты ресми арналар арқылы тексеріңіз.
  secrecy: >-
    «Ешкімге айтпаңыз» — алаяқтықтың айқын белгісі. Кез келген әрекеттен бұрын қоңырау
    туралы жақындарыңызбен немесе банк қызметкерімен сөйлесіңіз.
  otp_request: >-
    SMS немесе push-хабарламадағы кодты ешқашан ешкімге айтпаңыз. Нағыз ұйымдар оны
    сұрамайды.
  credentials_request: >-
    Карта нөмірін, CVV, ЖСН, логин мен құпиясөздерді айтпаңыз. Банк қызметкерлеріне
    бұл деректер қажет емес.
  safe_account: >-
    Ақша аудармаңыз. «Қауіпсіз» немесе «резервтік» шоттар жоқ — бұл ұрлықтың басты
    сценарийі.
  payment_redirect: >-
    Қоңырау шалушының нұсқауымен QR-код, терминал, криптовалюта немесе жеке нөмірге
    аударым арқылы төлем жасамаңыз.
  remote_access: >-
    AnyDesk, TeamViewer және басқа қашықтан қосылу бағдарламаларын орнатпаңыз —
    бұл құрылғыңыз бен шоттарыңызды басқаруды қоңырау шалушыға береді.
  prize_lottery: >-
    Нағыз ұтыс немесе төлем алдын ала төлемді және телефон арқылы дерек растауды талап
    етпейді. Ақпаратты ресми сайттан тексеріңіз.
  investment_scam: >-
    «Кепілді табыс» — қаржы пирамидасының белгісі. Салым жасамас бұрын компанияның
    лицензиясын реттеуші (АРРФР) сайтынан тексеріңіз.
  mule_recruitment: >-
    Сыйақыға өз атыңызға карта ашпаңыз және бөтен аударымдарды қабылдамаңыз — бұл ақша
    жылыстатуға қатысу және қылмыстық жауапкершілік.
  verification_ploy: >-
    Кіріс қоңырау арқылы жеке басты немесе операцияны «растамаңыз». Трубканы қойып,
    ұйымға ресми нөмір арқылы қоңырау шалыңыз.

verification_questions:
  - "Іс немесе өтінім нөмірі мен лауазымыңызды атаңыз."
  - "Қызметтік қызметкер идентификаторыңызды атаңыз."
  - "Ұйым сайтындағы ресми нөмір арқылы өзім қайта қоңырау шаламын."
  - "Сұранысты ресми қосымша немесе жеке кабинет арқылы жіберіңіз."

low_confidence_note: >-
  Белгілер бір мағыналы емес. Бұл алаяқтық деп кесіп айтпаймыз — ақпаратты ресми арналар
  арқылы өзіңіз тексеріңіз.
