# English recommendation strings (ADR D52). Externalized from recommend.py so localization can
# be reviewed/edited without touching code; pending native-speaker review like the RU/KK files.
# Every taxonomy tactic id MUST have an entry (coverage is validated at load time — a detected
# tactic must never lack advice). Kazakhstani institutions are named, with a short gloss: the
# reader is an English speaker in Kazakhstan, not a generic English audience.

tactic_advice:
  impersonation_bank: >-
    Hang up and call your bank back on the number printed on your card — never on the
    number that called you.
  impersonation_gov_police: >-
    Ask for the caller's full name, position and case number, then call the agency back on
    its official number. Police do not settle matters with money over the phone.
  impersonation_telecom_delivery: >-
    Do not renew contracts or confirm personal details on an incoming call. Call your
    operator or the delivery service on their official number.
  urgency: >-
    Do not rush. Pressure to "act right now" is itself a scam tactic. End the call and
    check the facts yourself.
  fear_threat: >-
    Do not decide anything while frightened. Banks and police do not make threats by phone.
    Verify through official channels.
  secrecy: >-
    "Tell no one" is a clear sign of a scam. Talk the call over with someone you trust, or
    with bank staff, before you do anything.
  otp_request: >-
    Never read out a code from an SMS or push notification, to anyone. Genuine organisations
    never ask for it.
  credentials_request: >-
    Do not give out your card number, CVV, IIN (your national ID number), logins or
    passwords. Real bank staff do not need them.
  safe_account: >-
    Do not transfer money. There is no such thing as a "safe" or "reserve" account — this is
    the single most common way money is stolen.
  payment_redirect: >-
    Do not pay via QR codes, payment terminals, cryptocurrency, or transfers to a personal
    number because a caller told you to.
  remote_access: >-
    Do not install AnyDesk, TeamViewer or any other remote-access app — it hands the caller
    control of your device and your accounts.
  prize_lottery: >-
    A real prize or payout never requires an advance payment or confirming your details by
    phone. Check on the organisation's official website.
  investment_scam: >-
    "Guaranteed returns" is a hallmark of a pyramid scheme. Check the company's licence with
    the regulator (ARDFM) before investing anything.
  mule_recruitment: >-
    Do not open cards in your name or accept other people's transfers for a fee — that is
    money laundering, and you would be criminally liable.
  verification_ploy: >-
    Do not "confirm" your identity or a transaction on an incoming call. Hang up and call the
    organisation on its official number.
  # ---- taxonomy v2 (ADR D63) ----
  imp_bank: >-
    Hang up and call your bank yourself on the number on the back of your card or in its
    app — not the number that called you.
  imp_law_enforcement: >-
    The police, the KNB and prosecutors never settle cases by phone or ask for money, codes
    or "help with the investigation". Ask for a name and case number, then call 102 yourself.
  imp_gov_service: >-
    eGov, public service centres, the tax committee, the pension fund and clinics never ask
    for codes or passwords by phone. Check for yourself on egov.kz or by calling 1414.
  imp_regulator: >-
    The National Bank and the financial regulator do not call citizens or "protect" money by
    phone. Hang up and call your own bank on its official number.
  imp_telecom_delivery_utility: >-
    Mobile operators, the post office, couriers and utilities never ask for an SMS code.
    Check your contract, parcel or bill in the official app.
  imp_personal: >-
    Hang up and call your relative or boss back on the number you already know. Voices can be
    faked; agree a family code word.
  loan_inducement: >-
    Never take out a loan because a caller tells you to — there is no such thing as a
    "mirror" or "protective" loan. Turn on the loan ban ("Stop-credit") in eGov.
  cash_courier_handoff: >-
    Do not withdraw cash or hand it to a courier or a "bank representative". No organisation
    collects money to "declare" or "keep it safe".
  refund_request: >-
    A mistaken transfer is returned only through the bank — with "Return transfer to sender",
    to the same account. Never send it to a different card or number.
  task_advance_fee: >-
    A job that makes you pay first is a scam. Do not pay "deposits" or "fees" for tasks,
    likes or buying out goods.
  callback_instruction: >-
    Do not press keys or call back a number the caller gives you. Look up the organisation's
    official number yourself — on its website or your card.
  # v3 (ADR D73) -- DRAFT pending the project owner's review
  minor_targeting: >-
    An adult stranger who asks a child to keep a secret, bring a parent's card, read out a
    code or leave home is a scammer. Child: hang up and tell your parents right away.
  blackmail_extortion: >-
    Do not pay blackmailers: paying never deletes anything, it only raises the demand. Keep
    the messages and the number and report it to the police (102).
  survey_pretext: >-
    Real surveys and the census never ask for your IIN, card number, bank or SMS codes. Stop
    the “survey” and give nothing.
  romance_trust: >-
    A new acquaintance you have never met in person who needs money for a ticket, customs or
    treatment is a classic scheme. Do not send money.
  charity_appeal: >-
    Real charities collect to an official account and never rush you. Do not send money to a
    personal card; check the charity on its official website.

verification_questions:
  - "Give me the case or request number, and your position."
  - "Give me your staff identification number."
  - "I will call you back on the official number from your organisation's website."
  - "Send the request through the official app or my online account."

low_confidence_note: >-
  The signals are ambiguous. We are not saying this is a scam — please verify through official
  channels yourself.

# Layer 3 (ADR D63): one reviewed line per scheme of data/taxonomy/schemes.yaml. Coverage is
# validated by explain/schemes.py.
scheme_advice:
  mirror_loan: >-
    This is the "mirror loan" scheme: a real bank never asks you to take a loan to "cancel"
    someone else's application. Sign nothing and call your bank on the number in its app.
  cash_declaration_courier: >-
    Cash is never "declared" or "insured" through a courier. Hand money to no one and report
    the call to 102.
  two_stage_escalation: >-
    First a "courier" or "public service centre" asks for a code, then "the police" or "the
    National Bank" call — it is one scheme. Hang up, call your bank and change your passwords.
  erroneous_transfer: >-
    If money really arrived by mistake, return it only through your bank, to the same account.
    Being asked to send it "to another card" is the sign of a scam.
  job_task_advance_fee: >-
    A "paid for likes" job that needs a deposit before you can withdraw is a scam. Do not pay
    and do not share card details.
  egov_eds_renewal: >-
    You renew a digital signature yourself, on egov.kz or pki.gov.kz; nobody calls to remind
    you or asks for a code. Hang up.
  tax_kgd_business: >-
    The tax committee does not suspend a business by phone or ask you to install apps. Check
    notices in your taxpayer account (cabinet.kgd.gov.kz).
  benefits_recalc_and_clinic: >-
    No SMS code is needed to recalculate a benefit or book a clinic visit. The code is the key
    to your eGov and your accounts: tell it to no one.
  parcel_code: >-
    A parcel code is entered by you in the app or shown to the courier in person — never read
    out over the phone. Check the parcel in the official app.
  telecom_contract_expiry: >-
    A phone contract does not "expire" because someone calls. Check your tariff in the
    operator's app or shop; install nothing and give no codes.
  utility_code: >-
    Utilities never ask for an SMS code for meters or the intercom. Check with your housing
    association or the number on your bill.
  marketplace_seller_phish: >-
    You do not need to give card details, a CVV or a code to receive a payment. Do not open
    "pay through the platform" links; talk only inside the service.
  fake_boss: >-
    A "boss" who urgently and secretly asks for money or hands you to a "curator" is almost
    certainly fake. Call them back on the number you know or speak in person.
  relative_in_trouble: >-
    A "relative in trouble" calling from a new number is a common scheme; voices can be faked.
    Call your relative on their usual number and ask something only they would know.
  regulator_impersonation: >-
    The National Bank, the regulator and the Antifraud Centre do not call citizens or move
    money "into protection". Hang up and call your own bank.
  law_enforcement_threat: >-
    Real investigators summon you in writing; they do not demand secrecy, data or money by
    phone. Hang up and call 102.
  bank_safe_account: >-
    "Safe accounts" do not exist. Transfer nothing; call the bank on the number on your card
    and block the card in the app if needed.
  bank_card_phish: >-
    A bank never asks for an SMS code, CVV or password, or for you to install software. Hang
    up and call the bank yourself.
  investment_broker: >-
    There is no such thing as guaranteed returns. Check the company's licence on the
    regulator's site and never give remote access to your phone.
  prize_compensation: >-
    A real prize or compensation never costs a "fee" or needs your card details. Check on the
    organisation's official website.
  mule_recruitment: >-
    Receiving and forwarding other people's money for a cut is money-mule work and a crime.
    Say no.
  # v3 (ADR D73) -- DRAFT pending the project owner's review
  minor_targeted: >-
    A call to a child about a secret, a parent's card or codes is a scheme aimed at children.
    Talk to your child: no codes and no secrets from parents; when in doubt, hang up.
  blackmail: >-
    This is blackmail. Do not pay or keep talking; keep the evidence and report it to the
    police (102).
  survey_data_harvest: >-
    A “survey” that moves on to your IIN, bank or codes is harvesting data for fraud. Hang up.
  romance_scam: >-
    A romance that ends with a request for money is a romance scam. Do not send money to
    someone you have never met in person.
  charity_fraud: >-
    Collecting “for treatment” or “for victims” to a personal card is a common scheme. Give
    only through the charity's official website.
