// Test harness for ADR D67 (debug builds only; no signing config: Gradle signs debug builds with
// the SDK's local debug key, which never belongs in this repository).
plugins {
    id 'com.android.application'
}

android {
    namespace 'kz.qorgan.webviewshell'
    compileSdk 35

    defaultConfig {
        applicationId 'kz.qorgan.webviewshell'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
